name: Lint

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on a PR; let main runs finish.
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  swiftlint:
    # macos-26 to match the project's macOS 26 deployment target (Liquid Glass).
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install SwiftLint
        run: brew install swiftlint
      # Hard gate: the tree is kept clean of the enabled rules, so `--strict`
      # turns any remaining warning into a build failure.
      - name: SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

  # The docs/guide pages are generated output served straight to GitHub Pages
  # (docs/ is the Pages root; there is no build step at deploy time), so a
  # docs/_content edit that forgets to regenerate silently ships a stale site.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Guide pages are up to date with docs/_content
        run: python3 docs/scripts/build_guide.py --check
