name: Lint

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on a PR; let main runs finish.
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which surfaces this change touches. Only SwiftLint is gated — it is the one
  # macOS runner here, billed at ten times the Linux rate, and it reads nothing
  # but Swift.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      swift: ${{ steps.filter.outputs.swift }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # PROBE: force the skip path to observe required-check behaviour.
          echo "swift=false" >> "$GITHUB_OUTPUT"; echo "plugins=false" >> "$GITHUB_OUTPUT"; exit 0
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "swift=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.number }}/files" \
            --jq '.[].filename')
          if echo "$files" | grep -qE '^(Sources|Tests|App|WidgetExtension)/|^Package\.swift$|^\.swiftlint\.yml$|^\.github/workflows/lint\.yml$'; then
            echo "swift=true" >> "$GITHUB_OUTPUT"
          else
            echo "swift=false" >> "$GITHUB_OUTPUT"
          fi

  swiftlint:
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    # macos-26 to match the project's macOS 26 deployment target (Liquid Glass).
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install SwiftLint
        run: brew install swiftlint
      # Hard gate: the tree is kept clean of the enabled rules, so `--strict`
      # turns any remaining warning into a build failure.
      - name: SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

  # The published site is built from docs/_content by docs-site/ (Astro +
  # Starlight) and deployed by docs.yml. These are the guards that hold the
  # documented surface to what Vee actually implements; none of them read the
  # rendered site, so they are unchanged by how it is built.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # docs/api/params.json is the parameter surface as data, and the
      # published tables are generated from it rather than typed — the chart
      # surface alone is a six-by-three cross-product that went stale the
      # moment it was written by hand, and for years was simply absent.
      #
      # The partials are committed, because docs/_content is read directly on
      # GitHub and the tables have to be reachable there too. Committed means a
      # stale copy is possible, so it is checked rather than regenerated here.
      - name: Generated reference tables are up to date with docs/api/params.json
        run: python3 docs/scripts/build_reference.py --check
      # The menu-line parameter list is written down six times (parser switch,
      # the public key set the linter uses, the authoring reference, and each of
      # the three SDKs). The docs copy silently fell behind once, and fifteen
      # parameters were once missing from every SDK at once; this stops both.
      - name: Menu-line parameters agree across parser, linter, docs, and SDKs
        run: python3 docs/scripts/check_params.py
      # `vee new`/`vee sdk` write the SDK beside a plugin from a copy embedded
      # in the binary. If that copy goes stale, they vendor an old SDK.
      - name: Embedded SDK sources are current
        run: python3 scripts/embed_sdk.py --check
      # docs/schemas is what a plugin author's editor validates against, so it
      # has to stay true to what the Swift parsers accept. Checked against the
      # golden fixtures all three SDKs produce byte-identically.
      - name: Published JSON Schemas match the shipped fixtures
        run: python3 docs/scripts/check_schemas.py
      # The plugins/ reorganisation moved examples/ and plugins/src/, breaking
      # four documented links with nothing to notice; three were still broken
      # two pull requests later. GitHub tree/blob URLs count as repository
      # paths here, because that is the shape every one of them had.
      - name: Documented links resolve
        run: python3 docs/scripts/check_links.py
      # The site is built here without deploying, so a docs change that cannot
      # be built fails on the pull request rather than on the deploy. This
      # replaces the guide-freshness and search-index guards: with no generated
      # output committed, neither staleness is a state the repository can be in.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Install docs site
        run: npm ci
        working-directory: docs-site
      - name: Docs site builds
        run: npm run build
        working-directory: docs-site
