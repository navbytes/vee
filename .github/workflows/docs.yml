name: Docs

# The site is built here rather than committed. Before this, docs/guide,
# docs/pagefind, llms.txt and llms-full.txt were generated output tracked in
# git — roughly 1.4 MB of build artifacts for 180 KB of prose, and a class of
# bug (published output stale relative to its source) that a build step cannot
# have.
on:
  push:
    branches: [main]
    # Only what the published site is built from. A Swift-only commit cannot
    # change a rendered page, and redeploying for one costs a build and a
    # deployment that produce byte-identical output.
    paths:
      - "docs/**"
      - "docs-site/**"
      - ".github/workflows/docs.yml"
      # The site serves this at /install.sh (staged from scripts/ during the
      # build), so a change to it has to redeploy. Without this the published
      # installer silently lags the repo until some other docs file happens to
      # change alongside it.
      - "scripts/install.sh"
      # Context7 indexes docs/_content and reads its parsing rules from here,
      # so a rules change has to re-index even when no page moved.
      - "context7.json"
  workflow_dispatch:

# Pages needs id-token to deploy; nothing here writes to the repository.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one midway: a half-published site is
# worse than a late one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      # The generated reference tables are inputs to the build, not outputs of
      # it: the pages include them, so they must exist before Astro renders.
      - name: Generate reference tables
        run: python3 docs/scripts/build_reference.py
      # The install script is served at vee.navbytes.io/install.sh. Copied from
      # scripts/ at build time rather than duplicated into the site, so the URL
      # in the README and the file people actually curl cannot drift apart.
      - name: Stage the install script
        run: |
          mkdir -p docs-site/public
          cp scripts/install.sh docs-site/public/install.sh
      - name: Install
        run: npm ci
        working-directory: docs-site
      - name: Build
        run: npm run build
        working-directory: docs-site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/dist
      - id: deploy
        uses: actions/deploy-pages@v5
      # The mirror below publishes the same bytes rather than rebuilding them.
      # Two builds of the same commit should be identical, but "should be" is
      # not a guarantee worth relying on when the point of the mirror is to be
      # the same site at a second URL.
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: docs-site/dist
          retention-days: 1

  # Publish the same build to Cloudflare Pages, at vee-docs.pages.dev.
  #
  # GitHub Pages redirects navbytes.github.io/vee/ to the custom domain, so the
  # canonical site has exactly one reachable hostname -- and a network that
  # blocks navbytes.io blocks the documentation outright, with no fallback.
  # This is that fallback. It is a mirror, not a second home: every page still
  # carries a canonical pointing at vee.navbytes.io (Astro emits it from `site`
  # in astro.config.mjs), so search engines keep indexing the primary and the
  # mirror does not compete with it.
  #
  # Runs after the deploy, like the Context7 refresh: the primary site is what
  # matters, and a mirror is not worth failing it over.
  mirror:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Absent credentials are not a failure, same reasoning as the
          # Context7 job below: on a fork, or before the secrets are set, the
          # mirror simply does not exist yet. Say so and move on rather than
          # turning a green docs deploy red.
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not both set — skipping the mirror."
            echo "Set them in repository secrets to enable it; see docs/design/docs-mirror.md."
            exit 0
          fi
          # --branch=main marks this a production deployment, which is what
          # serves the stable vee-docs.pages.dev hostname. Without it the
          # upload lands as a preview at a per-deployment subdomain, which
          # would defeat the point of having a second fixed URL.
          npx --yes wrangler@4 pages deploy dist \
            --project-name=vee-docs \
            --branch=main \
            --commit-dirty=true

  # Ask Context7 to re-index. It serves Vee's docs to LLMs and AI editors
  # (context7.com/navbytes/vee, indexing docs/_content per context7.json), and
  # it refreshes on its own schedule -- which means a shipped doc change can sit
  # stale in front of every model using it until that fires. This closes the
  # same gap the deploy above closes for the human-facing site.
  #
  # Runs after the deploy rather than beside it: there is no point asking for a
  # re-index of pages that failed to publish.
  context7:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Refresh the Context7 index
        env:
          API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
        run: |
          # Absent secret is not a failure. The docs deploy above is the job
          # that matters, and failing it over an optional third-party index --
          # on a fork, or before the key is set -- would be the tail wagging the
          # dog. Say so and move on.
          if [ -z "$API_KEY" ]; then
            echo "CONTEXT7_API_KEY is not set — skipping the Context7 refresh."
            echo "Set it in repository secrets to enable this; get a key at https://context7.com/dashboard"
            exit 0
          fi
          code=$(curl -sS -o /tmp/c7.json -w '%{http_code}' -X POST \
            https://context7.com/api/v1/refresh \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $API_KEY" \
            -d "{\"libraryName\": \"/${{ github.repository }}\"}")
          body=$(cat /tmp/c7.json 2>/dev/null || true)
          echo "HTTP $code"
          echo "$body"
          # A refresh is a request, not a guarantee: Context7 queues the
          # re-index. A non-2xx generally means the request did not land, and
          # is worth failing on.
          #
          # With one exception, found the first time this ran. Context7 allows
          # one library per account to be processing at a time, and rejects a
          # second with 400 user-has-active-task. That is not a failure to
          # request a re-index -- it means one is already underway, which is
          # the outcome this job exists to produce. Failing here would turn a
          # docs deploy red for having asked twice, and two pushes in quick
          # succession is exactly when that happens.
          case "$code" in
            2*)
              echo "Refresh requested."
              ;;
            *)
              case "$body" in
                *user-has-active-task*)
                  echo "A refresh is already in progress — nothing to do."
                  ;;
                *)
                  echo "Context7 refresh failed."
                  exit 1
                  ;;
              esac
              ;;
          esac
