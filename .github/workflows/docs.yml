name: Docs

# The site is built here rather than committed. Before this, docs/guide,
# docs/pagefind, llms.txt and llms-full.txt were generated output tracked in
# git — roughly 1.4 MB of build artifacts for 180 KB of prose, and a class of
# bug (published output stale relative to its source) that a build step cannot
# have.
on:
  push:
    branches: [main]
    # Only what the published site is built from. A Swift-only commit cannot
    # change a rendered page, and redeploying for one costs a build and a
    # deployment that produce byte-identical output.
    paths:
      - "docs/**"
      - "docs-site/**"
      - ".github/workflows/docs.yml"
      # The site serves this at /install.sh (staged from scripts/ during the
      # build), so a change to it has to redeploy. Without this the published
      # installer silently lags the repo until some other docs file happens to
      # change alongside it.
      - "scripts/install.sh"
      # Context7 indexes docs/_content and reads its parsing rules from here,
      # so a rules change has to re-index even when no page moved.
      - "context7.json"
  workflow_dispatch:

# Pages needs id-token to deploy; nothing here writes to the repository.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one midway: a half-published site is
# worse than a late one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      # The generated reference tables are inputs to the build, not outputs of
      # it: the pages include them, so they must exist before Astro renders.
      - name: Generate reference tables
        run: python3 docs/scripts/build_reference.py
      # The install script is served at vee.navbytes.io/install.sh. Copied from
      # scripts/ at build time rather than duplicated into the site, so the URL
      # in the README and the file people actually curl cannot drift apart.
      - name: Stage the install script
        run: |
          mkdir -p docs-site/public
          cp scripts/install.sh docs-site/public/install.sh
      - name: Install
        run: npm ci
        working-directory: docs-site
      - name: Build
        run: npm run build
        working-directory: docs-site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/dist
      - id: deploy
        uses: actions/deploy-pages@v5

  # Ask Context7 to re-index. It serves Vee's docs to LLMs and AI editors
  # (context7.com/navbytes/vee, indexing docs/_content per context7.json), and
  # it refreshes on its own schedule -- which means a shipped doc change can sit
  # stale in front of every model using it until that fires. This closes the
  # same gap the deploy above closes for the human-facing site.
  #
  # Runs after the deploy rather than beside it: there is no point asking for a
  # re-index of pages that failed to publish.
  context7:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Refresh the Context7 index
        env:
          API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
        run: |
          # Absent secret is not a failure. The docs deploy above is the job
          # that matters, and failing it over an optional third-party index --
          # on a fork, or before the key is set -- would be the tail wagging the
          # dog. Say so and move on.
          if [ -z "$API_KEY" ]; then
            echo "CONTEXT7_API_KEY is not set — skipping the Context7 refresh."
            echo "Set it in repository secrets to enable this; get a key at https://context7.com/dashboard"
            exit 0
          fi
          code=$(curl -sS -o /tmp/c7.json -w '%{http_code}' -X POST \
            https://context7.com/api/v1/refresh \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $API_KEY" \
            -d "{\"libraryName\": \"/${{ github.repository }}\"}")
          echo "HTTP $code"
          cat /tmp/c7.json || true
          echo
          # A refresh is a request, not a guarantee: Context7 queues the
          # re-index. Anything other than a 2xx is worth failing on, since the
          # request itself did not land.
          case "$code" in
            2*) echo "Refresh requested." ;;
            *) echo "Context7 refresh failed."; exit 1 ;;
          esac
