name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly reliability soak (the `soak` job below is gated to these events).
    - cron: '0 7 * * *'

# Cancel superseded runs on a PR; let main runs finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What this push or pull request actually touches. Every expensive job below
  # is gated on it.
  #
  # A documentation typo used to run the full macOS matrix: SwiftPM tests,
  # an unsigned app build, and SwiftLint — 4.7 minutes of wall time, and macOS
  # runners bill at ten times the Linux rate, so roughly 47 billable minutes to
  # check a sentence. Nothing in docs/ can change what Swift compiles to.
  #
  # The file list comes from the API rather than a git diff: it is exact, needs
  # no full clone, and cannot be confused by a shallow fetch or a force-push.
  # A push (rather than a pull request) runs everything — main is where being
  # sure matters more than being quick.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      swift: ${{ steps.filter.outputs.swift }}
      plugins: ${{ steps.filter.outputs.plugins }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "not a pull request — running everything"
            echo "swift=true"   >> "$GITHUB_OUTPUT"
            echo "plugins=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.number }}/files" \
            --jq '.[].filename')
          echo "changed files:"; echo "$files" | sed 's/^/  /'
          match() { echo "$files" | grep -qE "$1"; }

          # Swift, the app target, and the toolchain config that builds them.
          if match '^(Sources|Tests|App|WidgetExtension)/|^Package\.swift$|^project\.yml$|^\.swiftlint\.yml$|^\.github/workflows/(ci|lint)\.yml$'; then
            echo "swift=true" >> "$GITHUB_OUTPUT"
          else
            echo "swift=false" >> "$GITHUB_OUTPUT"
          fi

          # The SDKs and their shared golden fixtures.
          if match '^plugins/|^scripts/embed_sdk\.py$|^\.github/workflows/ci\.yml$'; then
            echo "plugins=true" >> "$GITHUB_OUTPUT"
          else
            echo "plugins=false" >> "$GITHUB_OUTPUT"
          fi

  swift:
    name: Build & test (SwiftPM)
    needs: changes
    if: needs.changes.outputs.swift == 'true' 
    # macos-26: the package targets .macOS("26.0") (Liquid Glass), which older
    # SDKs cannot build. All logic lives in library targets and is covered here.
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  app:
    name: Build Vee.app (xcodebuild)
    needs: changes
    if: needs.changes.outputs.swift == 'true' 
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      # The .xcodeproj is generated from project.yml, not committed.
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      # Signing is exercised in the release workflow; here we only verify the
      # app target compiles, links, and bundles.
      - name: Build app (unsigned)
        run: >
          xcodebuild -project Vee.xcodeproj -scheme Vee -configuration Debug
          -derivedDataPath .build/xcode
          CODE_SIGNING_ALLOWED=NO build

  soak:
    name: Reliability soak (memory + refresh)
    # Opt-in: runs nightly and on manual dispatch only — never on every PR — so
    # normal CI stays fast. Proves the bounded-memory / no-refresh-death moat by
    # driving the real execution/refresh pipeline for a sustained window.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - name: Toolchain
        run: swift --version
      - name: Soak benchmark (VEE_SOAK=1)
        env:
          VEE_SOAK: "1"
          VEE_SOAK_DURATION_SECONDS: "120"
        run: swift test --filter MemorySoakBenchmarkTests

  plugins:
    name: Plugin SDK (TypeScript)
    needs: changes
    if: needs.changes.outputs.plugins == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: plugins/typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # No dependencies to install — the SDK is zero-dep and Node runs the
      # TypeScript directly. `npm test` runs the fixture drift guard.
      - name: Test (fixture drift guard)
        run: npm test

  plugins-python:
    name: Plugin SDK (Python)
    needs: changes
    if: needs.changes.outputs.plugins == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: plugins/python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # Zero-dep, standard-library only. The drift guard asserts each example's
      # build() output matches its golden fixture (shared with the TS SDK).
      - name: Test (fixture drift guard)
        run: python3 -m unittest discover -s test -v

  plugins-go:
    name: Plugin SDK (Go)
    needs: changes
    if: needs.changes.outputs.plugins == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: plugins/go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.21"
      # Zero-dep, standard-library only. `go test` runs the fixture drift guard
      # (the fixture is shared byte-for-byte with the TS/Python SDKs).
      - name: Test (fixture drift guard)
        run: go test ./...
