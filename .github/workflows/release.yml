name: Release

# Push a semver tag (v*) to cut a release: build Vee.app (Release) and publish a
# zip to a GitHub Release.
#
# If the APPLE_* signing secrets are configured, the app is Developer-ID signed,
# notarized, and stapled. Without them the app is ad-hoc signed and a downloaded
# copy needs a one-time right-click → Open to pass Gatekeeper.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write
  # npm provenance signs the package against this workflow run; without it
  # `npm publish --provenance` fails.
  id-token: write

jobs:
  release:
    # macos-26: the release build targets .macOS("26.0") (Liquid Glass).
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # Absent secrets resolve to "" → the sign/notarize steps are skipped and an
      # ad-hoc-signed app is published.
      APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
      APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
      # Absent → the Homebrew-tap sync step is skipped (fork/unconfigured repos
      # still release cleanly). A fine-grained PAT with contents:write on
      # navbytes/homebrew-tap.
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      APP_PATH: .build/xcode/Build/Products/Release/Vee.app
    steps:
      - uses: actions/checkout@v7

      # Idempotent on purpose. Everything after this step can fail — notarization,
      # the npm publish, the Homebrew sync — and the tag is already pushed by
      # then, so re-running the job is the natural recovery. Creating the tag
      # unconditionally made that impossible: the re-run died here on "tag
      # already exists" before reaching the step that actually failed, leaving a
      # new version number or a manual fix as the only ways out.
      #
      # Re-running against an existing tag is safe: the tag names a commit, and
      # the job rebuilds that same commit.
      - name: Create + push tag (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::notice::${TAG} already exists — re-running the release against it."
            exit 0
          fi
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      # The Go SDK is a module in a subdirectory, so Go resolves its versions
      # from tags prefixed with that path — a bare `v0.2.0` is invisible to it,
      # and `go get` falls back to a pseudo-version naming a commit hash. This
      # gives Go users the same version everything else ships under.
      #
      # Runs for both triggers (dispatch and a pushed tag), and tolerates the
      # tag already existing so a re-run after a later failure is not blocked.
      - name: Tag the Go module
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          go_tag="plugins/go/${TAG}"
          if git ls-remote --exit-code --tags origin "refs/tags/${go_tag}" >/dev/null 2>&1; then
            echo "${go_tag} already exists — leaving it alone."
          else
            git tag -a "${go_tag}" -m "Go SDK ${TAG}"
            git push origin "${go_tag}"
            echo "Pushed ${go_tag}"
          fi

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Set app version from tag
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          version="${TAG#v}"
          sed -i '' "s/CFBundleShortVersionString: \"[^\"]*\"/CFBundleShortVersionString: \"${version}\"/" project.yml
          sed -i '' "s/MARKETING_VERSION: \"[^\"]*\"/MARKETING_VERSION: \"${version}\"/" project.yml
          # The CLI can run without an app bundle around it (installed on its
          # own, or a bare build), so the fallback has to carry the real
          # version too — otherwise `vee --version` reports a placeholder.
          sed -i '' "s/^let fallbackVersion = \".*\"$/let fallbackVersion = \"${version}\"/" Sources/VeeCLI/Version.swift
          grep -q "let fallbackVersion = \"${version}\"" Sources/VeeCLI/Version.swift \
            || { echo "::error::failed to stamp the version into Sources/VeeCLI/Version.swift"; exit 1; }
          # The npm package carries the same version as the app on purpose: the
          # SDK and the parser that reads its output ship from one commit, so a
          # matching pair is a guaranteed-compatible pair.
          ( cd plugins/typescript && npm version "${version}" --no-git-tag-version --allow-same-version )

      - name: Generate project
        run: xcodegen generate

      - name: Import signing certificate
        if: env.APPLE_CERT_P12 != ''
        run: |
          echo "$APPLE_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import cert.p12 -k build.keychain -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
          rm cert.p12

      - name: Build Vee.app (Release)
        run: |
          if [ -n "$APPLE_DEVELOPER_ID" ]; then
            xcodebuild -project Vee.xcodeproj -scheme Vee -configuration Release \
              -derivedDataPath .build/xcode \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="$APPLE_DEVELOPER_ID" \
              DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
              CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
              OTHER_CODE_SIGN_FLAGS="--timestamp --options=runtime" \
              build
          else
            xcodebuild -project Vee.xcodeproj -scheme Vee -configuration Release \
              -derivedDataPath .build/xcode \
              CODE_SIGNING_ALLOWED=NO build
          fi

      - name: Notarize + staple
        if: env.APPLE_NOTARY_PASSWORD != ''
        run: |
          ditto -c -k --keepParent "$APP_PATH" Vee-notarize.zip
          # Capture the exit code without `set -e` aborting on the assignment,
          # so the notarytool output is always printed — otherwise a submit
          # failure (e.g. bad credentials) exits before we can show why.
          set +e
          out=$(xcrun notarytool submit Vee-notarize.zip \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_NOTARY_PASSWORD" --wait 2>&1)
          code=$?
          set -e
          echo "$out"
          if [ "$code" -eq 0 ] && echo "$out" | grep -q "status: Accepted"; then
            xcrun stapler staple "$APP_PATH"
          else
            id=$(echo "$out" | awk '/id:/{print $2; exit}')
            if [ -n "$id" ]; then
              echo "::error::Notarization not accepted — fetching detailed log for submission $id"
              xcrun notarytool log "$id" \
                --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_NOTARY_PASSWORD" || true
            else
              echo "::error::notarytool submit failed before creating a submission (exit $code) — usually invalid/expired APPLE_NOTARY_PASSWORD, wrong APPLE_ID/APPLE_TEAM_ID, or an unaccepted Apple Developer agreement."
            fi
            exit 1
          fi

      - name: Package
        run: ditto -c -k --keepParent "$APP_PATH" Vee.zip

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: Vee.zip
          fail_on_unmatched_files: true

      # Publish the TypeScript SDK using npm trusted publishing: the registry
      # verifies this workflow's OIDC identity instead of a token, so there is
      # no NPM_TOKEN to leak, to rotate every 90 days, or to forget. It also
      # sidesteps the two things that broke 0.3.0 — a token without 2FA bypass
      # is rejected outright (EOTP), and one *with* it has its publishes staged
      # for manual confirmation, which npm is restricting anyway.
      #
      # Configured at npmjs.com on the package: publisher GitHub Actions,
      # navbytes/vee, workflow release.yml. Requires npm >= 11.5.1 (Node 24
      # ships 11.17) and the id-token: write permission granted above.
      # Provenance is attested automatically; no --provenance flag needed.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - name: Publish @navbytes/vee to npm
        working-directory: plugins/typescript
        run: |
          version="$(node -p "require('./package.json').version")"
          # npm refuses to republish a version, which would strand a re-run here
          # the way the tag step used to. Skipping work that is already done is
          # not the same as skipping because a credential is missing: there is
          # no credential to miss any more, and a genuine publish failure still
          # fails the release.
          if npm view "@navbytes/vee@${version}" version >/dev/null 2>&1; then
            echo "::notice::@navbytes/vee@${version} is already published — nothing to do."
            exit 0
          fi
          # prepublishOnly builds and re-checks the compiled output against the
          # golden fixtures, so a package that would differ from the source
          # never leaves the runner.
          npm publish --access public

      # Keep navbytes/homebrew-tap tracking this release. Self-seeding: creates
      # Casks/vee.rb on the first run and bumps version + sha256 afterwards.
      # Skipped when HOMEBREW_TAP_TOKEN is unset (see the job env above).
      - name: Sync Homebrew cask (navbytes/homebrew-tap)
        if: env.HOMEBREW_TAP_TOKEN != ''
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: bash scripts/update-homebrew-cask.sh
