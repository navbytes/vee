version: 2
updates:
  # GitHub Actions used by the workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The documentation site (Astro + Starlight) — the only third-party
  # dependency tree in the repository, and the reason the zero-dependency
  # policy now reads "in what ships" rather than "anywhere". Nothing here is
  # linked into a binary, executed by a user, or vendored into a plugin, but a
  # build toolchain is still a supply chain and is treated as one.
  #
  # Grouped and weekly: individual bumps across a transitive tree this size are
  # noise, and noise is how a real advisory gets scrolled past.
  - package-ecosystem: npm
    directory: "/docs-site"
    schedule:
      interval: weekly
    groups:
      docs-site:
        patterns: ["*"]
    open-pull-requests-limit: 3

  # No SwiftPM entry: every Swift target is first-party, and the app and all
  # three plugin SDKs remain dependency-free by policy. Add one only if that
  # ever stops being true.
